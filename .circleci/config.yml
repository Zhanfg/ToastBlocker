# GitHub Actions build is broken because android-actions/setup-android installs the retired
# SDK package "tools" (Failed to find package 'tools'). This pipeline avoids setup-android;
# never install the obsolete "tools" package here.

version: 2.1

orbs:
  android: circleci/android@3.2.0

jobs:
  build:
    executor:
      name: android/android_docker
      tag: "2026.11.1"
      resource_class: medium+
    steps:
      - checkout
      - run:
          name: Ensure SDK packages
          command: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - android/restore_gradle_cache:
          cache_prefix: v1-toastblocker
      - run:
          name: Test and build APK
          command: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - android/save_gradle_cache:
          cache_prefix: v1-toastblocker
      - store_test_results:
          path: app/build/test-results
      - store_artifacts:
          path: app/build/outputs/apk/debug/app-debug.apk
          destination: ToastBlocker-debug
      - run:
          name: Verify debug APK exists
          command: |
            if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
              echo "Missing expected APK: app/build/outputs/apk/debug/app-debug.apk"
              exit 1
            fi

workflows:
  build:
    jobs:
      - build
