name: Build KernelSU Next legacy-33024 manager

on:
  push:
    branches:
      - ksunext-legacy-33024
    paths:
      - 'ksunext-build/**'
      - '.github/workflows/ksunext-legacy-33024.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UPSTREAM_COMMIT: ac5de08b7702ba57aff64499a64f70e87d339252
      NDK_VERSION: 29.0.14206865

    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4

      - name: Checkout KernelSU Next 33278 source
        run: |
          cd ksunext-build
          git clone --filter=blob:none https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          cd KernelSU-Next
          git checkout "$UPSTREAM_COMMIT"
          echo "Upstream: $(git describe --tags --always)"
          echo "Version count: $(git rev-list --count HEAD)"

      - name: Apply legacy 33024 compatibility layer
        run: |
          python3 ksunext-build/patch_legacy_33024.py
          git -C ksunext-build/KernelSU-Next diff --check
          git -C ksunext-build/KernelSU-Next diff -- manager/app/src/main/java/com/rifsxd/ksunext/Natives.kt
          git -C ksunext-build/KernelSU-Next diff -- manager/app/src/main/java/com/rifsxd/ksunext/ui/MainActivity.kt
          git -C ksunext-build/KernelSU-Next diff -- manager/app/src/main/java/com/rifsxd/ksunext/ui/screen/Home.kt
          git -C ksunext-build/KernelSU-Next diff -- manager/app/src/main/cpp/jni.cc

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK / NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build legacy Manager persistence module
        run: |
          LLVM_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="$LLVM_BIN/aarch64-linux-android26-clang"

          rm -rf ksunext-build/persist-module-stage
          mkdir -p ksunext-build/persist-module-stage/bin

          "$CC" -Os -fPIE -pie -Wl,--strip-all             -o ksunext-build/persist-module-stage/bin/claim_manager             ksunext-build/persist-module/claim_manager.c

          cp ksunext-build/persist-module/module.prop ksunext-build/persist-module-stage/
          cp ksunext-build/persist-module/common.sh ksunext-build/persist-module-stage/
          cp ksunext-build/persist-module/post-fs-data.sh ksunext-build/persist-module-stage/
          cp ksunext-build/persist-module/service.sh ksunext-build/persist-module-stage/
          cp ksunext-build/persist-module/customize.sh ksunext-build/persist-module-stage/

          chmod 0755             ksunext-build/persist-module-stage/bin/claim_manager             ksunext-build/persist-module-stage/common.sh             ksunext-build/persist-module-stage/post-fs-data.sh             ksunext-build/persist-module-stage/service.sh             ksunext-build/persist-module-stage/customize.sh

          file ksunext-build/persist-module-stage/bin/claim_manager
          mkdir -p out
          (
            cd ksunext-build/persist-module-stage
            zip -9 -r ../../out/KernelSU_Next_Compat_Manager_Persistence_33024-v1.0.0.zip .
          )
          unzip -l out/KernelSU_Next_Compat_Manager_Persistence_33024-v1.0.0.zip

      - name: Setup Rust
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-linux-android

      - name: Build arm64 ksud from the same 33278 source
        working-directory: ksunext-build/KernelSU-Next
        run: |
          LLVM_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$LLVM_BIN:$PATH"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$LLVM_BIN/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$LLVM_BIN/aarch64-linux-android26-clang"
          export CXX_aarch64_linux_android="$LLVM_BIN/aarch64-linux-android26-clang++"
          export AR_aarch64_linux_android="$LLVM_BIN/llvm-ar"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--sysroot=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot -I$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/aarch64-linux-android -I$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
          clang --target=aarch64-linux-gnu -c -nostdlib             -o userspace/ksud/.lkm_image_bootstrap.o             userspace/ksud/src/lkm_image_bootstrap.S
          cargo build --locked --target aarch64-linux-android --release --manifest-path userspace/ksud/Cargo.toml
          mkdir -p manager/app/src/main/jniLibs/arm64-v8a
          cp userspace/ksud/target/aarch64-linux-android/release/ksud              manager/app/src/main/jniLibs/arm64-v8a/libksud.so
          file manager/app/src/main/jniLibs/arm64-v8a/libksud.so

      - name: Configure side-by-side Compat APK (arm64-v8a)
        working-directory: ksunext-build/KernelSU-Next
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("manager/app/build.gradle.kts")
          s = p.read_text()
          anchor = '    namespace = "com.rifsxd.ksunext"\n'
          insert = '''    namespace = "com.rifsxd.ksunext"

              defaultConfig {
                  applicationId = "com.rifsxd.ksunext.compat33024"
                  ndk {
                      abiFilters += listOf("arm64-v8a")
                  }
              }
          '''
          if anchor not in s:
              raise SystemExit("arm64 build.gradle anchor not found")
          p.write_text(s.replace(anchor, insert, 1))
          PY

      - name: Build release APK
        working-directory: ksunext-build/KernelSU-Next/manager
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean assembleRelease

      - name: Collect APK and persistence module
        run: |
          mkdir -p out
          APK="$(find ksunext-build/KernelSU-Next/manager/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" out/KernelSU_Next_Compat_v3.3.0-64_33278-for-33024-arm64-release.apk
          sha256sum out/*.apk out/*.zip | tee out/SHA256SUMS.txt

      - name: Upload APK and persistence module
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-Compat-33278-for-33024-with-persistence
          path: out/*
          if-no-files-found: error
          retention-days: 14
